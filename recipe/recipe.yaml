schema_version: 1

context:
  name: tstoolbox
  version: "108.2.6"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: 039cd05f66e1e0823fe4082af7cd0b5dac3e88bb243bc2fad94ba103685bdf4f

build:
  number: 1
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - tstoolbox = tstoolbox.tstoolbox:main

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools >=45
    - setuptools-scm >=6.2
    - wheel
    - pip
  run:
    - python >=${{ python_min }}
    - cltoolbox >=1.0.0
    - dateparser
    - hydroerr
    - numpy
    - openpyxl
    - pandas
    - pint !=0.21
    - pint-pandas
    - plottoolbox >=105.0.1
    - pydantic >=2.0.0
    - scikit-learn
    - scipy
    - statsmodels
    - tabulate

tests:
  - python:
      imports:
        - tstoolbox
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - requirements:
      run:
        - pip
        - python ${{ python_min }}.*
    script:
      - tstoolbox --help

about:
  summary: Command line script and Python library to manipulate time series.
  license: BSD-3-Clause
  license_file: LICENSE.txt
  homepage: https://pypi.org/project/tstoolbox/

extra:
  recipe-maintainers:
    - timcera
